server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: daily-games-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/daily_games}
    username: ${DATABASE_USER:daily_games}
    password: ${DATABASE_PASSWORD:daily_games}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-base-url: ${APP_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:Daily Club <login@localhost>}
  token-pepper: ${AUTH_TOKEN_PEPPER:local-development-only-change-me}
  secure-cookie: ${SECURE_COOKIE:false}
  magic-link-minutes: 15
  session-days: 30
