server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: daily-games-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/daily_games}
    username: ${DATABASE_USER:daily_games}
    password: ${DATABASE_PASSWORD:daily_games}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-base-url: ${APP_BASE_URL:http://localhost:3000}
  brevo:
    api-url: ${BREVO_API_URL:https://api.brevo.com}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Daily Tracker}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id: ${STRIPE_LEADERBOARD_PRICE_ID:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:}
    connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:20000}
  discord:
    application-id: ${DISCORD_APPLICATION_ID:}
    public-key: ${DISCORD_PUBLIC_KEY:}
  token-pepper: ${AUTH_TOKEN_PEPPER:local-development-only-change-me}
  secure-cookie: ${SECURE_COOKIE:false}
  verification-hours: 24
  password-reset-minutes: 30
  session-days: 30
